<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Koinos Project</title>
<meta name="description" content="An ordinary English rendering of the Greek New Testament — read the Greek and the new English side by side.">
<style>
  /* ---------- Design tokens ---------- */
  :root {
    --bg: #0e0d0c;
    --surface: rgba(28, 27, 25, 0.72);
    --surface-solid: #1c1b19;
    --sheet: #171614;
    --text: #e9e6e1;
    --text-secondary: #a39d94;
    --text-tertiary: #6e6960;
    --accent: #c9a66b;
    --accent-soft: rgba(201, 166, 107, 0.14);
    --hairline: rgba(255, 255, 255, 0.09);
    --shadow: 0 24px 70px rgba(0, 0, 0, 0.55), 0 2px 10px rgba(0, 0, 0, 0.3);
    --radius: 14px;
    --serif: "New York", "Iowan Old Style", Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Roboto, sans-serif;
    --greek-color: #b3ada3;
    --mark-bg: rgba(201, 166, 107, 0.32);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #faf9f7;
      --surface: rgba(255, 255, 255, 0.78);
      --surface-solid: #ffffff;
      --sheet: #ffffff;
      --text: #201d19;
      --text-secondary: #6f695f;
      --text-tertiary: #a09a90;
      --accent: #9a7434;
      --accent-soft: rgba(154, 116, 52, 0.10);
      --hairline: rgba(0, 0, 0, 0.10);
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.16), 0 2px 10px rgba(0, 0, 0, 0.08);
      --greek-color: #7d766b;
      --mark-bg: rgba(154, 116, 52, 0.25);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    font-family: var(--serif);
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    min-height: 100%;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header ---------- */
  header {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 20px 12px;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    -webkit-backdrop-filter: saturate(1.6) blur(18px);
    backdrop-filter: saturate(1.6) blur(18px);
    border-bottom: 1px solid var(--hairline);
  }
  .wordmark {
    font-family: var(--sans);
    font-size: 12px; font-weight: 600;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--accent);
    cursor: pointer; user-select: none;
    background: none; border: none;
  }
  .wordmark span { color: var(--text-secondary); font-weight: 400; }
  .greek-toggle {
    font-family: var(--serif);
    font-size: 13px; line-height: 1;
    padding: 7px 12px;
    color: var(--text-secondary);
    background: none;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    cursor: pointer;
    transition: color .18s ease, border-color .18s ease, background .18s ease;
  }
  .greek-toggle[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .greek-toggle:hover { color: var(--text); }

  /* ---------- Reading column ---------- */
  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 40px 24px calc(120px + env(safe-area-inset-bottom, 0px));
    contain: layout style;
  }
  .spread { animation: pagein .22s ease both; }
  @keyframes pagein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .kicker {
    font-family: var(--sans);
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--text-tertiary);
    margin-bottom: 18px;
  }
  .kicker b { color: var(--accent); font-weight: 600; }

  h1.title {
    font-weight: 500; font-size: 34px; line-height: 1.2;
    letter-spacing: -0.01em; margin-bottom: 6px;
  }
  .subtitle { color: var(--text-secondary); font-size: 17px; margin-bottom: 34px; }

  .prose p { margin-bottom: 1.15em; font-size: 17.5px; }
  .prose p:last-child { margin-bottom: 0; }

  .greek-block {
    font-size: 16.5px;
    color: var(--greek-color);
    border-left: 2px solid var(--hairline);
    padding-left: 18px;
    margin: 0 0 30px;
    line-height: 1.8;
  }
  body.hide-greek .greek-block { display: none; }

  .english-block { font-size: 19px; }
  .english-block p { margin-bottom: 1.15em; }
  .english-block p:last-child { margin-bottom: 0; }

  .w {
    cursor: pointer;
    border-bottom: 1px dotted color-mix(in srgb, var(--accent) 55%, transparent);
    transition: background .15s ease;
    border-radius: 3px;
  }
  .w:hover { background: var(--accent-soft); }
  mark { background: var(--mark-bg); color: inherit; border-radius: 3px; padding: 0 1px; }

  .ms-summary {
    font-family: var(--sans);
    font-size: 14px; line-height: 1.6;
    color: var(--text-secondary);
    background: var(--accent-soft);
    border: 1px solid var(--hairline);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 34px;
  }

  /* ---------- Bottom bar ---------- */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    -webkit-backdrop-filter: saturate(1.6) blur(20px);
    backdrop-filter: saturate(1.6) blur(20px);
    border-top: 1px solid var(--hairline);
  }
  .bar-btn {
    display: grid; place-items: center;
    width: 40px; height: 40px;
    border: none; border-radius: 12px;
    background: none; color: var(--text-secondary);
    cursor: pointer;
    transition: background .16s ease, color .16s ease, transform .1s ease;
  }
  .bar-btn:hover { background: var(--accent-soft); color: var(--accent); }
  .bar-btn:active { transform: scale(0.93); }
  .bar-btn svg { width: 20px; height: 20px; }

  .pager {
    display: flex; align-items: center; gap: 4px;
    font-family: var(--sans); font-size: 13px; font-weight: 500;
    color: var(--text-secondary);
    user-select: none;
  }
  .pager .label { min-width: 110px; text-align: center; font-variant-numeric: tabular-nums; }
  .chev {
    display: grid; place-items: center;
    width: 36px; height: 36px;
    border: none; border-radius: 10px;
    background: none; color: var(--text);
    cursor: pointer;
    transition: background .16s ease, opacity .16s ease, transform .1s ease;
  }
  .chev:hover { background: var(--accent-soft); }
  .chev:active { transform: scale(0.93); }
  .chev[disabled] { opacity: 0.25; cursor: default; background: none; }
  .chev svg { width: 18px; height: 18px; }

  /* ---------- Popover (word lookup) ---------- */
  #popover {
    position: fixed; z-index: 60;
    width: min(330px, calc(100vw - 24px));
    background: var(--surface);
    -webkit-backdrop-filter: saturate(1.6) blur(24px);
    backdrop-filter: saturate(1.6) blur(24px);
    border: 1px solid var(--hairline);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 15px 17px;
    font-family: var(--sans);
    opacity: 0; transform: scale(0.96) translateY(4px);
    transform-origin: top center;
    pointer-events: none;
    transition: opacity .16s ease, transform .16s ease;
  }
  #popover.on { opacity: 1; transform: none; pointer-events: auto; }
  .pop-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-tertiary);
    margin-bottom: 3px;
  }
  .pop-greek { font-family: var(--serif); font-size: 20px; color: var(--accent); margin-bottom: 10px; }
  .pop-variants { font-size: 14px; line-height: 1.5; margin-bottom: 10px; }
  .pop-example {
    font-size: 13px; line-height: 1.55; color: var(--text-secondary);
    border-top: 1px solid var(--hairline);
    padding-top: 9px; font-style: italic;
  }

  /* ---------- Sheets (search / index) ---------- */
  .scrim {
    position: fixed; inset: 0; z-index: 45;
    background: rgba(0, 0, 0, 0.42);
    opacity: 0; pointer-events: none;
    transition: opacity .22s ease;
  }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 50%; bottom: 0; z-index: 50;
    width: min(680px, 100vw);
    max-height: 78vh;
    transform: translate(-50%, 103%);
    background: var(--sheet);
    border: 1px solid var(--hairline); border-bottom: none;
    border-radius: 18px 18px 0 0;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column;
    transition: transform .3s cubic-bezier(.32,.72,.25,1);
    font-family: var(--sans);
  }
  .sheet.on { transform: translate(-50%, 0); }
  .sheet-head {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px 12px;
    border-bottom: 1px solid var(--hairline);
    flex: none;
  }
  .sheet-title { font-size: 15px; font-weight: 600; flex: 1; }
  .sheet-close {
    display: grid; place-items: center;
    width: 30px; height: 30px;
    border: none; border-radius: 999px;
    background: var(--accent-soft); color: var(--text-secondary);
    cursor: pointer; font-size: 14px;
  }
  .sheet-body { overflow-y: auto; overscroll-behavior: contain; padding: 8px 10px 24px; }

  .search-input {
    flex: 1;
    font-family: var(--sans); font-size: 16px;
    color: var(--text);
    background: var(--accent-soft);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 9px 13px;
    outline: none;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text-tertiary); }

  .group-label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-tertiary);
    padding: 14px 10px 6px;
  }
  .row {
    display: block; width: 100%; text-align: left;
    border: none; background: none; color: var(--text);
    font-family: var(--sans);
    padding: 10px 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: background .14s ease;
  }
  .row:hover { background: var(--accent-soft); }
  .row .r-title { font-size: 15px; font-weight: 500; margin-bottom: 2px; }
  .row .r-title .gk { font-family: var(--serif); color: var(--accent); }
  .row .r-sub { font-size: 13px; color: var(--text-secondary); line-height: 1.45; }
  .row .r-sub b { color: var(--text); font-weight: 600; }
  .empty-note { padding: 26px 10px; text-align: center; color: var(--text-tertiary); font-size: 14px; }

  .idx-ms { padding: 12px 10px 4px; }
  .idx-ms .r-title { font-size: 16px; font-weight: 600; }
  .idx-ms .r-sub { margin-top: 3px; }

  @media (max-width: 480px) {
    h1.title { font-size: 28px; }
    .english-block { font-size: 18px; }
    .pager .label { min-width: 84px; }
  }
</style>
</head>
<body>

<header>
  <button class="wordmark" id="homeBtn" title="Go to the beginning">ΚΟΙΝΟΣ <span>· The Koinos Project</span></button>
  <button class="greek-toggle" id="greekBtn" aria-pressed="true" title="Show or hide the Greek text">Αα Greek</button>
</header>

<main id="content" aria-live="polite"></main>

<div class="bar">
  <button class="bar-btn" id="searchBtn" title="Search words (press /)" aria-label="Search words">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg>
  </button>
  <div class="pager">
    <button class="chev" id="prevBtn" aria-label="Previous page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="label" id="pageLabel"></div>
    <button class="chev" id="nextBtn" aria-label="Next page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
  <button class="bar-btn" id="indexBtn" title="Index" aria-label="Index">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
  </button>
</div>

<div id="popover" role="dialog" aria-label="Word lookup"></div>
<div class="scrim" id="scrim"></div>

<section class="sheet" id="searchSheet" role="dialog" aria-label="Search words">
  <div class="sheet-head">
    <input class="search-input" id="searchInput" type="search" placeholder="Search a word — English or Greek" autocomplete="off" spellcheck="false">
    <button class="sheet-close" data-close aria-label="Close">✕</button>
  </div>
  <div class="sheet-body" id="searchResults"><div class="empty-note">Type to search the lexicon and the text.</div></div>
</section>

<section class="sheet" id="indexSheet" role="dialog" aria-label="Index">
  <div class="sheet-head">
    <div class="sheet-title">Index</div>
    <button class="sheet-close" data-close aria-label="Close">✕</button>
  </div>
  <div class="sheet-body" id="indexBody"></div>
</section>

<script>window.KOINOS_DATA = {

  "introduction": {
    "title": "What this book is and why it exists",
    "text": "Open almost any English Bible and you will meet a vocabulary that exists nowhere else in your life. Nobody at work says sin, nobody at dinner says baptize, nobody texts a friend about righteousness or repentance or the gospel. These are sacral-pseudo words: ordinary Greek words of the first century that were never really translated at all. They were transliterated, fossilized, or assigned a special churchly meaning, and then repeated for so many centuries that English speakers stopped noticing they carry no ordinary meaning. Hamartia meant an error, a miss, a fault — Aristotle uses it for the flaw that undoes a tragic hero. Ekklesia meant an assembly of people, the same word Athens used for its citizen meetings. Baptizo meant to dip or immerse — Polybius uses it for ships going under in a sea battle. Euangelion meant good news, the kind a runner brings from a battlefield. Christos meant a person smeared with oil, an anointed one. Kyrios meant a master, an owner, a sir. None of these were religious code words. They were the plain furniture of everyday speech.\n\nA word with no ordinary meaning is a word each reader must furnish privately. That is the quiet damage sacral-pseudo vocabulary does: because the words mean nothing in modern conversation, their meaning is supplied by imagination, by childhood associations, by the last sermon a reader heard. The meaning shifts from person to person and decade to decade. The text stops behaving like literature and starts behaving like theater — grand, echoing, and unaccountable, a fabled parody of the plain documents underneath. And because every group furnishes the empty words differently, the result is division: denominations built on conflicting privately-imagined meanings of words that once meant nothing more mysterious than error, assembly, dip, and good news.\n\nThe Koinos Project takes the opposite path. Koinos is the Greek word for common, shared, ordinary — the very word scholars use for the everyday Greek of this period, Koine. These documents were ordinary literature in their own time, written in the common speech of shopkeepers, soldiers, and letter-writers. This translation restores that register. Every word is rendered the way translators render non-religious Greek texts of the same era — histories, private letters, medical manuals, contracts. Where tradition writes baptize, this book writes immerse. Where tradition writes sin, this book writes error or failure. Where tradition writes repent, this book writes change your thinking. Where tradition writes Christ, this book writes the anointed. No traditional English rendering was consulted or followed; the English here answers only to the Greek and to ordinary modern usage.\n\nThe formatting also follows the originals. The early manuscripts have no chapter numbers, no verse numbers, no headings — those were added between the 13th and 16th centuries. So this book has none. The text runs as continuous prose, divided into natural paragraphs and paginated like an ordinary printed book, with the Greek and the new English paired on every page. Each document opens with a short note on when it was likely composed and where its earliest surviving copies were found. The Greek text printed here follows a modern critical edition assembled from the earliest surviving manuscripts, chiefly the great fourth-century codices Sinaiticus and Vaticanus and the earlier papyri. Click any highlighted word in the English to see the Greek behind it, its ordinary range of meaning, and a sentence showing the same word at work in non-religious Greek writing.\n\nNothing has been added and nothing softened. The aim is simply this: that reading these pages should feel the way reading them felt in the first century — like reading something written by ordinary people, in ordinary words, about things they thought mattered."

  "manuscripts": [
    {
      "name": "Matthew (ΚΑΤΑ ΜΑΘΘΑΙΟΝ — 'According to Matthew')",
      "summary": "Composed in Greek, most likely between about 70 and 90 CE, probably in or near Syria. The earliest surviving pieces are small papyrus fragments from Egypt copied within roughly a century of composition. The earliest complete copy is in Codex Sinaiticus, a parchment book of about 330–360 CE found at Saint Catherine's Monastery at the foot of Mount Sinai and brought to scholarly attention between 1844 and 1859; Codex Vaticanus, of about the same date, preserves it as well. The original, like all books of its time, ran as continuous text with no chapter or verse numbers. The Greek printed here follows a modern critical edition assembled from these earliest witnesses.",
      "pages": [
        {
          "page": 1,
          "greek": "Βίβλος γενέσεως Ἰησοῦ χριστοῦ υἱοῦ Δαυὶδ υἱοῦ Ἀβραάμ. Ἀβραὰμ ἐγέννησεν τὸν Ἰσαάκ, Ἰσαὰκ δὲ ἐγέννησεν τὸν Ἰακώβ, Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰούδαν καὶ τοὺς ἀδελφοὺς αὐτοῦ, Ἰούδας δὲ ἐγέννησεν τὸν Φαρὲς καὶ τὸν Ζάρα ἐκ τῆς Θαμάρ, Φαρὲς δὲ ἐγέννησεν τὸν Ἑσρώμ, Ἑσρὼμ δὲ ἐγέννησεν τὸν Ἀράμ, Ἀρὰμ δὲ ἐγέννησεν τὸν Ἀμιναδάβ, Ἀμιναδὰβ δὲ ἐγέννησεν τὸν Ναασσών, Ναασσὼν δὲ ἐγέννησεν τὸν Σαλμών, Σαλμὼν δὲ ἐγέννησεν τὸν Βόες ἐκ τῆς Ῥαχάβ, Βόες δὲ ἐγέννησεν τὸν Ἰωβὴδ ἐκ τῆς Ῥούθ, Ἰωβὴδ δὲ ἐγέννησεν τὸν Ἰεσσαί, Ἰεσσαὶ δὲ ἐγέννησεν τὸν Δαυὶδ τὸν βασιλέα. Δαυὶδ δὲ ἐγέννησεν τὸν Σολομῶνα ἐκ τῆς τοῦ Οὐρίου, Σολομὼν δὲ ἐγέννησεν τὸν Ῥοβοάμ, Ῥοβοὰμ δὲ ἐγέννησεν τὸν Ἀβιά, Ἀβιὰ δὲ ἐγέννησεν τὸν Ἀσάφ, Ἀσὰφ δὲ ἐγέννησεν τὸν Ἰωσαφάτ, Ἰωσαφὰτ δὲ ἐγέννησεν τὸν Ἰωράμ, Ἰωρὰμ δὲ ἐγέννησεν τὸν Ὀζίαν, Ὀζίας δὲ ἐγέννησεν τὸν Ἰωαθάμ, Ἰωαθὰμ δὲ ἐγέννησεν τὸν Ἀχάζ, Ἀχὰζ δὲ ἐγέννησεν τὸν Ἑζεκίαν, Ἑζεκίας δὲ ἐγέννησεν τὸν Μανασσῆ, Μανασσῆς δὲ ἐγέννησεν τὸν Ἀμώς, Ἀμὼς δὲ ἐγέννησεν τὸν Ἰωσίαν, Ἰωσίας δὲ ἐγέννησεν τὸν Ἰεχονίαν καὶ τοὺς ἀδελφοὺς αὐτοῦ ἐπὶ τῆς μετοικεσίας Βαβυλῶνος. Μετὰ δὲ τὴν μετοικεσίαν Βαβυλῶνος Ἰεχονίας ἐγέννησεν τὸν Σαλαθιήλ, Σαλαθιὴλ δὲ ἐγέννησεν τὸν Ζοροβαβέλ, Ζοροβαβὲλ δὲ ἐγέννησεν τὸν Ἀβιούδ, Ἀβιοὺδ δὲ ἐγέννησεν τὸν Ἐλιακίμ, Ἐλιακὶμ δὲ ἐγέννησεν τὸν Ἀζώρ, Ἀζὼρ δὲ ἐγέννησεν τὸν Σαδώκ, Σαδὼκ δὲ ἐγέννησεν τὸν Ἀχίμ, Ἀχὶμ δὲ ἐγέννησεν τὸν Ἐλιούδ, Ἐλιοὺδ δὲ ἐγέννησεν τὸν Ἐλεάζαρ, Ἐλεάζαρ δὲ ἐγέννησεν τὸν Ματθάν, Ματθὰν δὲ ἐγέννησεν τὸν Ἰακώβ, Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰωσὴφ τὸν ἄνδρα Μαρίας, ἐξ ἧς ἐγεννήθη Ἰησοῦς ὁ λεγόμενος χριστός. Πᾶσαι οὖν αἱ γενεαὶ ἀπὸ Ἀβραὰμ ἕως Δαυὶδ γενεαὶ δεκατέσσαρες, καὶ ἀπὸ Δαυὶδ ἕως τῆς μετοικεσίας Βαβυλῶνος γενεαὶ δεκατέσσαρες, καὶ ἀπὸ τῆς μετοικεσίας Βαβυλῶνος ἕως τοῦ χριστοῦ γενεαὶ δεκατέσσαρες.",
          "english": "The family record of Jesus the anointed, son of David, son of Abraham.\n\nAbraham fathered Isaac. Isaac fathered Jacob. Jacob fathered Judah and his brothers. Judah fathered Perez and Zerah by Tamar. Perez fathered Hezron. Hezron fathered Aram. Aram fathered Amminadab. Amminadab fathered Nahshon. Nahshon fathered Salmon. Salmon fathered Boaz by Rahab. Boaz fathered Obed by Ruth. Obed fathered Jesse, and Jesse fathered David the king.\n\nDavid fathered Solomon by the wife of Uriah. Solomon fathered Rehoboam. Rehoboam fathered Abijah. Abijah fathered Asaph. Asaph fathered Jehoshaphat. Jehoshaphat fathered Joram. Joram fathered Uzziah. Uzziah fathered Jotham. Jotham fathered Ahaz. Ahaz fathered Hezekiah. Hezekiah fathered Manasseh. Manasseh fathered Amos. Amos fathered Josiah, and Josiah fathered Jechoniah and his brothers at the time of the forced move to Babylon.\n\nAfter the forced move to Babylon, Jechoniah fathered Shealtiel. Shealtiel fathered Zerubbabel. Zerubbabel fathered Abiud. Abiud fathered Eliakim. Eliakim fathered Azor. Azor fathered Zadok. Zadok fathered Achim. Achim fathered Eliud. Eliud fathered Eleazar. Eleazar fathered Matthan. Matthan fathered Jacob, and Jacob fathered Joseph, the husband of Mary — and from her Jesus was born, the one called the anointed.\n\nSo all the generations from Abraham to David come to fourteen generations; from David to the forced move to Babylon, fourteen generations; and from the forced move to Babylon to the anointed, fourteen generations."
        },
        {
          "page": 2,
          "greek": "Τοῦ δὲ Ἰησοῦ χριστοῦ ἡ γένεσις οὕτως ἦν. μνηστευθείσης τῆς μητρὸς αὐτοῦ Μαρίας τῷ Ἰωσήφ, πρὶν ἢ συνελθεῖν αὐτοὺς εὑρέθη ἐν γαστρὶ ἔχουσα ἐκ πνεύματος ἁγίου. Ἰωσὴφ δὲ ὁ ἀνὴρ αὐτῆς, δίκαιος ὢν καὶ μὴ θέλων αὐτὴν δειγματίσαι, ἐβουλήθη λάθρᾳ ἀπολῦσαι αὐτήν. ταῦτα δὲ αὐτοῦ ἐνθυμηθέντος ἰδοὺ ἄγγελος κυρίου κατʼ ὄναρ ἐφάνη αὐτῷ λέγων· Ἰωσὴφ υἱὸς Δαυίδ, μὴ φοβηθῇς παραλαβεῖν Μαρίαν τὴν γυναῖκά σου, τὸ γὰρ ἐν αὐτῇ γεννηθὲν ἐκ πνεύματός ἐστιν ἁγίου· τέξεται δὲ υἱὸν καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν, αὐτὸς γὰρ σώσει τὸν λαὸν αὐτοῦ ἀπὸ τῶν ἁμαρτιῶν αὐτῶν. τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῇ τὸ ῥηθὲν ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος· Ἰδοὺ ἡ παρθένος ἐν γαστρὶ ἕξει καὶ τέξεται υἱόν, καὶ καλέσουσιν τὸ ὄνομα αὐτοῦ Ἐμμανουήλ· ὅ ἐστιν μεθερμηνευόμενον Μεθʼ ἡμῶν ὁ θεός. ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου ἐποίησεν ὡς προσέταξεν αὐτῷ ὁ ἄγγελος κυρίου καὶ παρέλαβεν τὴν γυναῖκα αὐτοῦ· καὶ οὐκ ἐγίνωσκεν αὐτὴν ἕως οὗ ἔτεκεν υἱόν· καὶ ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν. Τοῦ δὲ Ἰησοῦ γεννηθέντος ἐν Βηθλέεμ τῆς Ἰουδαίας ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως, ἰδοὺ μάγοι ἀπὸ ἀνατολῶν παρεγένοντο εἰς Ἱεροσόλυμα λέγοντες· Ποῦ ἐστιν ὁ τεχθεὶς βασιλεὺς τῶν Ἰουδαίων; εἴδομεν γὰρ αὐτοῦ τὸν ἀστέρα ἐν τῇ ἀνατολῇ καὶ ἤλθομεν προσκυνῆσαι αὐτῷ. ἀκούσας δὲ ὁ βασιλεὺς Ἡρῴδης ἐταράχθη καὶ πᾶσα Ἱεροσόλυμα μετʼ αὐτοῦ, καὶ συναγαγὼν πάντας τοὺς ἀρχιερεῖς καὶ γραμματεῖς τοῦ λαοῦ ἐπυνθάνετο παρʼ αὐτῶν ποῦ ὁ χριστὸς γεννᾶται. οἱ δὲ εἶπαν αὐτῷ· Ἐν Βηθλέεμ τῆς Ἰουδαίας· οὕτως γὰρ γέγραπται διὰ τοῦ προφήτου· Καὶ σύ, Βηθλέεμ γῆ Ἰούδα, οὐδαμῶς ἐλαχίστη εἶ ἐν τοῖς ἡγεμόσιν Ἰούδα· ἐκ σοῦ γὰρ ἐξελεύσεται ἡγούμενος, ὅστις ποιμανεῖ τὸν λαόν μου τὸν Ἰσραήλ. Τότε Ἡρῴδης λάθρᾳ καλέσας τοὺς μάγους ἠκρίβωσεν παρʼ αὐτῶν τὸν χρόνον τοῦ φαινομένου ἀστέρος, καὶ πέμψας αὐτοὺς εἰς Βηθλέεμ εἶπεν· Πορευθέντες ἐξετάσατε ἀκριβῶς περὶ τοῦ παιδίου· ἐπὰν δὲ εὕρητε, ἀπαγγείλατέ μοι, ὅπως κἀγὼ ἐλθὼν προσκυνήσω αὐτῷ.",
          "english": "This is how the birth of Jesus the anointed came about. His mother Mary was engaged to Joseph, but before they had come together she was found to be pregnant — from sacred breath. Joseph her husband, a fair man who did not want to disgrace her publicly, decided to end the engagement quietly. But while he was turning this over in his mind, a messenger of the Master appeared to him in a dream and said, 'Joseph, son of David, do not be afraid to take Mary home as your wife, because what has been conceived in her is from sacred breath. She will give birth to a son, and you are to name him Jesus, because he will rescue his people from their errors.'\n\nAll of this happened so that what the Master had said through his spokesman would come true: 'Look — the virgin will be pregnant and will give birth to a son, and they will name him Emmanouel,' which translates as 'God with us.'\n\nWhen Joseph woke from his sleep, he did what the Master's messenger had ordered and took his wife home; and he did not sleep with her until she had given birth to a son. And he named him Jesus.\n\nAfter Jesus was born in Bethlehem in Judea, in the days of King Herod, astrologers from the east arrived in Jerusalem asking, 'Where is the newborn king of the Judeans? We saw his star at its rising, and we have come to bow down before him.' When King Herod heard this he was shaken, and all Jerusalem with him. He gathered all the chief priests and scholars of the people and questioned them about where the anointed was to be born. 'In Bethlehem in Judea,' they told him, 'because this is what was written through the spokesman: And you, Bethlehem in the land of Judah, are by no means the least among the leaders of Judah, for out of you will come a leader who will shepherd my people Israel.'\n\nThen Herod called the astrologers in secretly and established from them the exact time the star had appeared. He sent them to Bethlehem and said, 'Go and make a careful search for the child. When you find him, report back to me, so that I can come and bow down before him too.'"
        },
        {
          "page": 3,
          "greek": "οἱ δὲ ἀκούσαντες τοῦ βασιλέως ἐπορεύθησαν, καὶ ἰδοὺ ὁ ἀστὴρ ὃν εἶδον ἐν τῇ ἀνατολῇ προῆγεν αὐτούς, ἕως ἐλθὼν ἐστάθη ἐπάνω οὗ ἦν τὸ παιδίον. ἰδόντες δὲ τὸν ἀστέρα ἐχάρησαν χαρὰν μεγάλην σφόδρα. καὶ ἐλθόντες εἰς τὴν οἰκίαν εἶδον τὸ παιδίον μετὰ Μαρίας τῆς μητρὸς αὐτοῦ, καὶ πεσόντες προσεκύνησαν αὐτῷ, καὶ ἀνοίξαντες τοὺς θησαυροὺς αὐτῶν προσήνεγκαν αὐτῷ δῶρα, χρυσὸν καὶ λίβανον καὶ σμύρναν. καὶ χρηματισθέντες κατʼ ὄναρ μὴ ἀνακάμψαι πρὸς Ἡρῴδην διʼ ἄλλης ὁδοῦ ἀνεχώρησαν εἰς τὴν χώραν αὐτῶν. Ἀναχωρησάντων δὲ αὐτῶν ἰδοὺ ἄγγελος κυρίου φαίνεται κατʼ ὄναρ τῷ Ἰωσὴφ λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ φεῦγε εἰς Αἴγυπτον, καὶ ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι· μέλλει γὰρ Ἡρῴδης ζητεῖν τὸ παιδίον τοῦ ἀπολέσαι αὐτό. ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ νυκτὸς καὶ ἀνεχώρησεν εἰς Αἴγυπτον, καὶ ἦν ἐκεῖ ἕως τῆς τελευτῆς Ἡρῴδου· ἵνα πληρωθῇ τὸ ῥηθὲν ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος· Ἐξ Αἰγύπτου ἐκάλεσα τὸν υἱόν μου. Τότε Ἡρῴδης ἰδὼν ὅτι ἐνεπαίχθη ὑπὸ τῶν μάγων ἐθυμώθη λίαν, καὶ ἀποστείλας ἀνεῖλεν πάντας τοὺς παῖδας τοὺς ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς ἀπὸ διετοῦς καὶ κατωτέρω, κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων. τότε ἐπληρώθη τὸ ῥηθὲν διὰ Ἰερεμίου τοῦ προφήτου λέγοντος· Φωνὴ ἐν Ῥαμὰ ἠκούσθη, κλαυθμὸς καὶ ὀδυρμὸς πολύς· Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς, καὶ οὐκ ἤθελεν παρακληθῆναι ὅτι οὐκ εἰσίν. Τελευτήσαντος δὲ τοῦ Ἡρῴδου ἰδοὺ ἄγγελος κυρίου φαίνεται κατʼ ὄναρ τῷ Ἰωσὴφ ἐν Αἰγύπτῳ λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ πορεύου εἰς γῆν Ἰσραήλ, τεθνήκασιν γὰρ οἱ ζητοῦντες τὴν ψυχὴν τοῦ παιδίου. ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ εἰσῆλθεν εἰς γῆν Ἰσραήλ. ἀκούσας δὲ ὅτι Ἀρχέλαος βασιλεύει τῆς Ἰουδαίας ἀντὶ τοῦ πατρὸς αὐτοῦ Ἡρῴδου ἐφοβήθη ἐκεῖ ἀπελθεῖν· χρηματισθεὶς δὲ κατʼ ὄναρ ἀνεχώρησεν εἰς τὰ μέρη τῆς Γαλιλαίας, καὶ ἐλθὼν κατῴκησεν εἰς πόλιν λεγομένην Ναζαρέτ, ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τῶν προφητῶν ὅτι Ναζωραῖος κληθήσεται.",
          "english": "After hearing the king they set out, and there was the star they had seen at its rising, going ahead of them until it came to a stop above the place where the child was. Seeing the star filled them with tremendous joy. They went into the house and saw the child with his mother Mary, and falling to the ground they bowed down before him. Then they opened their cases and offered him gifts: gold, frankincense, and myrrh. And having been warned in a dream not to go back to Herod, they returned to their own country by another road.\n\nAfter they had gone, a messenger of the Master appeared to Joseph in a dream and said, 'Get up, take the child and his mother, and escape to Egypt. Stay there until I tell you, because Herod is about to hunt for the child to kill him.' So he got up, took the child and his mother by night, and left for Egypt, and he stayed there until Herod's death. This was so that what the Master had said through his spokesman would come true: 'Out of Egypt I called my son.'\n\nWhen Herod realized the astrologers had made a fool of him, he was furious. He sent men and killed all the boys in Bethlehem and its whole surrounding territory who were two years old or younger, going by the time he had established from the astrologers. Then what was said through Jeremiah the spokesman came true: 'A voice was heard in Rama, weeping and loud grieving: Rachel crying for her children, and she would not be comforted, because they are gone.'\n\nAfter Herod died, a messenger of the Master appeared in a dream to Joseph in Egypt and said, 'Get up, take the child and his mother, and go to the land of Israel, because the ones who were hunting for the child's life are dead.' So he got up, took the child and his mother, and entered the land of Israel. But hearing that Archelaus was ruling Judea in place of his father Herod, he was afraid to go there, and after being warned in a dream he withdrew to the district of Galilee. He went and settled in a town called Nazareth, so that what was said through the spokesmen would come true: he will be called a Nazorean."
        },

          "page": 4,

          "english": "Then Jesus came from Galilee to the Jordan, to John, to be immersed by him. John kept trying to stop him, saying, 'I am the one who needs to be immersed by you — and you are coming to me?' Jesus answered him, 'Let it be for now; this is the fitting way for us to complete everything that is right.' Then John let him. As soon as Jesus was immersed he came up out of the water — and look: the skies were opened, and he saw the breath of God coming down like a dove and settling on him, and a voice out of the skies said: 'This is my son, the one I love. He is my delight.'\n\nThen Jesus was led up into the open country by the breath, to be tested by the slanderer. After going without food for forty days and forty nights, he was finally hungry. The tester came up and said to him, 'If you are God's son, tell these stones to become loaves of bread.' He answered, 'It is written: A human being will not live on bread alone, but on every word that comes out of God's mouth.'\n\nThen the slanderer took him to the sacred city, stood him on the high edge of the temple, and said to him, 'If you are God's son, throw yourself down — because it is written: He will give his messengers orders about you, and they will carry you on their hands, so that you never strike your foot against a stone.' Jesus said to him, 'It is also written: You will not put the Master your God to the test.'\n\nAgain the slanderer took him to a very high mountain and showed him all the kingdoms of the world and their splendor, and said to him, 'I will give you all of this, if you will fall down and bow before me.' Then Jesus said to him, 'Get away, adversary! Because it is written: You will bow down before the Master your God, and you will serve him alone.' Then the slanderer left him — and look: messengers came and waited on him."

<script>
(function () {
  "use strict";

  /* ================= Data ================= */
  function boot(data) {
    if (!data) { document.getElementById("content").innerHTML = '<div class="empty-note">Could not load koinos_data.json</div>'; return; }
    App.init(data);
  }
  var App = {};

  /* ---------- helpers ---------- */
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  var reEsc = function (s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); };
  var norm = function (s) { return s.toLowerCase().replace(/[’']/g, "'"); };

  App.init = function (data) {
    var D = data;
    var spreads = [];           // flat reading order
    var lexPhrases = [];        // multi-word lexicon keys
    var lexSingle = Object.create(null);
    var stemIndex = Object.create(null);
    var textIndex = null;       // lazy search index
    var cur = 0;
    var pendingQuery = null;    // highlight after jump

    /* ----- build reading order ----- */
    spreads.push({ type: "intro" });
    D.manuscripts.forEach(function (ms, mi) {
      spreads.push({ type: "cover", mi: mi });
      ms.pages.forEach(function (p, pi) {
        spreads.push({ type: "page", mi: mi, pi: pi });
      });
    });

    /* ----- build lexicon lookup ----- */
    Object.keys(D.lexicon || {}).forEach(function (key) {
      var k = norm(key);
      if (k.indexOf(" ") !== -1) lexPhrases.push(k);
      else lexSingle[k] = key;
      // light stemming: index base forms so inflections resolve
      ["s", "es", "ed", "d", "ing", "er"].forEach(function (suf) {
        stemIndex[k + suf] = key;
      });
      if (k.slice(-1) === "e") stemIndex[k.slice(0, -1) + "ing"] = key;
      stemIndex[k] = key;
    });
    lexPhrases.sort(function (a, b) { return b.length - a.length; });
    var phraseRe = lexPhrases.length
      ? new RegExp("\\b(" + lexPhrases.map(reEsc).join("|") + ")\\b", "gi")
      : null;

    function lookupToken(tok) {
      var t = norm(tok).replace(/^[^a-z']+|[^a-z']+$/g, "");
      if (!t) return null;
      if (stemIndex[t]) return stemIndex[t];
      if (t.slice(-1) === "s" && stemIndex[t.slice(0, -1)]) return stemIndex[t.slice(0, -1)];
      return null;
    }

    /* ----- render English with clickable words ----- */
    function clickable(text) {
      var parts = [];
      var last = 0;
      var marks = [];
      if (phraseRe) {
        phraseRe.lastIndex = 0;
        var m;
        while ((m = phraseRe.exec(text))) marks.push([m.index, m.index + m[0].length, norm(m[0])]);
      }
      var out = "";
      var idx = 0;
      function emitPlain(seg) {
        out += seg.replace(/[A-Za-z][A-Za-z’'-]*/g, function (w) {
          var key = lookupToken(w);
          return key ? '<span class="w" data-k="' + esc(key) + '">' + esc(w) + "</span>" : esc(w);
        });
      }
      marks.forEach(function (mk) {
        if (mk[0] > idx) emitPlain(text.slice(idx, mk[0]));
        var key = stemIndex[mk[2]] || mk[2];
        out += '<span class="w" data-k="' + esc(key) + '">' + esc(text.slice(mk[0], mk[1])) + "</span>";
        idx = mk[1];
      });
      emitPlain(text.slice(idx));
      return out;
    }

    function paras(text, cls, doClick, highlight) {
      return text.split(/\n\n+/).map(function (p) {
        var html = doClick ? clickable(p) : esc(p);
        if (highlight) {
          var hre = new RegExp("(>[^<]*?)\\b(" + reEsc(highlight) + ")", "gi");
          html = ("&gt;" + html).replace(new RegExp("\\b(" + reEsc(highlight) + ")\\b(?![^<]*>)", "gi"), "<mark>$1</mark>").slice(4);
        }
        return "<p>" + html + "</p>";
      }).join("");
    }

    /* ----- spreads ----- */
    function render() {
      var s = spreads[cur];
      var html = "";
      if (s.type === "intro") {
        html = '<div class="spread"><div class="kicker"><b>' + esc(D.project) + "</b></div>" +
          '<h1 class="title">' + esc(D.introduction.title) + "</h1>" +
          '<div class="subtitle">' + esc(D.subtitle) + "</div>" +
          '<div class="prose">' + paras(D.introduction.text, "", false, null) + "</div></div>";
      } else if (s.type === "cover") {
        var ms = D.manuscripts[s.mi];
        html = '<div class="spread"><div class="kicker"><b>Manuscript</b></div>' +
          '<h1 class="title">' + esc(ms.name) + "</h1>" +
          '<div class="ms-summary">' + esc(ms.summary) + "</div>" +
          '<div class="subtitle">Turn the page to begin reading.</div></div>';
      } else {
        var ms2 = D.manuscripts[s.mi];
        var p = ms2.pages[s.pi];
        html = '<div class="spread"><div class="kicker"><b>' + esc(ms2.name.split(" (")[0]) + "</b> · Page " + p.page + "</div>" +
          '<div class="greek-block">' + esc(p.greek) + "</div>" +
          '<div class="english-block">' + paras(p.english, "", true, pendingQuery) + "</div></div>";
      }
      var content = document.getElementById("content");
      content.innerHTML = html;
      pendingQuery = null;
      document.getElementById("prevBtn").disabled = cur === 0;
      document.getElementById("nextBtn").disabled = cur === spreads.length - 1;
      var label = s.type === "intro" ? "Introduction"
        : s.type === "cover" ? "Title page"
        : "Page " + (s.pi + 1) + " of " + D.manuscripts[s.mi].pages.length;
      document.getElementById("pageLabel").textContent = label;
      window.scrollTo({ top: 0 });
      hidePopover();
    }

    function go(i) {
      if (i < 0 || i >= spreads.length || i === cur) return;
      cur = i;
      render();
    }

    /* ----- popover ----- */
    var pop = document.getElementById("popover");
    var popShownAt = 0;
    function showPopover(el, key) {
      popShownAt = performance.now();
      var e = D.lexicon[key];
      if (!e) return;
      pop.innerHTML =
        '<div class="pop-label">Greek</div><div class="pop-greek">' + esc(e.greek) + "</div>" +
        '<div class="pop-label">Ordinary range</div><div class="pop-variants">' + esc(e.variants.join(" · ")) + "</div>" +
        '<div class="pop-example">' + esc(e.secular_example) + "</div>";
      var r = el.getBoundingClientRect();
      pop.classList.add("on");
      var pw = pop.offsetWidth, ph = pop.offsetHeight;
      var x = Math.min(Math.max(12, r.left + r.width / 2 - pw / 2), window.innerWidth - pw - 12);
      var below = r.bottom + 10;
      var y = below + ph > window.innerHeight - 70 ? r.top - ph - 10 : below;
      pop.style.left = x + "px";
      pop.style.top = Math.max(12, y) + "px";
    }
    function hidePopover() { pop.classList.remove("on"); }

    document.getElementById("content").addEventListener("click", function (ev) {
      var w = ev.target.closest(".w");
      if (w) { ev.stopPropagation(); showPopover(w, w.dataset.k); }
    });
    document.addEventListener("click", function (ev) {
      if (!ev.target.closest("#popover") && !ev.target.closest(".w")) hidePopover();
    });
    window.addEventListener("scroll", function () {
      if (performance.now() - popShownAt > 300) hidePopover();
    }, { passive: true });

    /* ----- sheets ----- */
    var scrim = document.getElementById("scrim");
    var sheets = { search: document.getElementById("searchSheet"), index: document.getElementById("indexSheet") };
    var openSheet = null;
    function open(name) {
      close();
      openSheet = name;
      sheets[name].classList.add("on");
      scrim.classList.add("on");
      if (name === "search") setTimeout(function () { document.getElementById("searchInput").focus(); }, 220);
      if (name === "index") buildIndex();
    }
    function close() {
      if (!openSheet) return;
      sheets[openSheet].classList.remove("on");
      scrim.classList.remove("on");
      openSheet = null;
    }
    scrim.addEventListener("click", close);
    document.querySelectorAll("[data-close]").forEach(function (b) { b.addEventListener("click", close); });
    document.getElementById("searchBtn").addEventListener("click", function () { open("search"); });
    document.getElementById("indexBtn").addEventListener("click", function () { open("index"); });

    /* ----- index sheet ----- */
    var indexBuilt = false;
    function buildIndex() {
      if (indexBuilt) return;
      indexBuilt = true;
      var out = ['<button class="row" data-go="0"><div class="r-title">Introduction</div><div class="r-sub">What this book is and why it exists</div></button>'];
      spreads.forEach(function (s, i) {
        if (s.type === "cover") {
          var ms = D.manuscripts[s.mi];
          out.push('<div class="idx-ms"><div class="r-title">' + esc(ms.name) + '</div><div class="r-sub">' + esc(ms.summary.split(". ").slice(0, 1).join(".")) + '.</div></div>');
          out.push('<button class="row" data-go="' + i + '"><div class="r-sub">Title page &amp; manuscript summary</div></button>');
        } else if (s.type === "page") {
          var p = D.manuscripts[s.mi].pages[s.pi];
          var preview = p.english.replace(/\n+/g, " ").split(/\s+/).slice(0, 10).join(" ");
          out.push('<button class="row" data-go="' + i + '"><div class="r-title">Page ' + p.page + '</div><div class="r-sub">' + esc(preview) + "…</div></button>");
        }
      });
      document.getElementById("indexBody").innerHTML = out.join("");
    }
    document.getElementById("indexBody").addEventListener("click", function (ev) {
      var row = ev.target.closest("[data-go]");
      if (row) { close(); go(+row.dataset.go); }
    });

    /* ----- search ----- */
    function ensureTextIndex() {
      if (textIndex) return textIndex;
      textIndex = [];
      spreads.forEach(function (s, i) {
        if (s.type !== "page") return;
        var p = D.manuscripts[s.mi].pages[s.pi];
        textIndex.push({ i: i, page: p.page, en: p.english, enLow: norm(p.english), gk: p.greek });
      });
      return textIndex;
    }
    function snippet(text, pos, qlen) {
      var start = Math.max(0, pos - 44);
      var end = Math.min(text.length, pos + qlen + 56);
      var s = (start > 0 ? "…" : "") + text.slice(start, end) + (end < text.length ? "…" : "");
      return s.replace(/\n+/g, " ");
    }
    var debounce;
    document.getElementById("searchInput").addEventListener("input", function (ev) {
      clearTimeout(debounce);
      var q = ev.target.value.trim();
      debounce = setTimeout(function () { runSearch(q); }, 110);
    });
    function runSearch(q) {
      var box = document.getElementById("searchResults");
      if (q.length < 2) { box.innerHTML = '<div class="empty-note">Type to search the lexicon and the text.</div>'; return; }
      var nq = norm(q);
      var out = [];

      // Lexicon matches (English keys, variants, Greek)
      var lexHits = [];
      Object.keys(D.lexicon).forEach(function (key) {
        var e = D.lexicon[key];
        var hay = norm(key + " " + e.variants.join(" ") + " " + e.greek);
        if (hay.indexOf(nq) !== -1) lexHits.push([key, e]);
      });
      if (lexHits.length) {
        out.push('<div class="group-label">Lexicon</div>');
        lexHits.slice(0, 8).forEach(function (h) {
          out.push('<button class="row" data-word="' + esc(h[0]) + '"><div class="r-title">' + esc(h[0]) +
            ' <span class="gk">' + esc(h[1].greek) + '</span></div><div class="r-sub">' + esc(h[1].variants.join(" · ")) + "</div></button>");
        });
      }

      // Text matches
      var hits = [];
      ensureTextIndex().forEach(function (t) {
        var pos = t.enLow.indexOf(nq);
        var isGk = false;
        if (pos === -1 && /[Ͱ-Ͽἀ-῿]/.test(q)) { pos = t.gk.indexOf(q); isGk = true; }
        if (pos !== -1) hits.push({ t: t, pos: pos, gk: isGk });
      });
      if (hits.length) {
        out.push('<div class="group-label">In the text</div>');
        hits.slice(0, 20).forEach(function (h) {
          var src = h.gk ? h.t.gk : h.t.en;
          var snip = esc(snippet(src, h.pos, q.length)).replace(new RegExp("(" + reEsc(esc(q)) + ")", "i"), "<b>$1</b>");
          out.push('<button class="row" data-goq="' + h.t.i + '" data-q="' + esc(q) + '"><div class="r-title">Page ' + h.t.page + '</div><div class="r-sub">' + snip + "</div></button>");
        });
      }
      box.innerHTML = out.length ? out.join("") : '<div class="empty-note">No matches for “' + esc(q) + "”.</div>";
    }
    document.getElementById("searchResults").addEventListener("click", function (ev) {
      var wordRow = ev.target.closest("[data-word]");
      if (wordRow) {
        close();
        var key = wordRow.dataset.word;
        // show as centered popover
        var e = D.lexicon[key];
        pop.innerHTML =
          '<div class="pop-label">Greek</div><div class="pop-greek">' + esc(e.greek) + "</div>" +
          '<div class="pop-label">Ordinary range</div><div class="pop-variants">' + esc(e.variants.join(" · ")) + "</div>" +
          '<div class="pop-example">' + esc(e.secular_example) + "</div>";
        popShownAt = performance.now();
        pop.classList.add("on");
        pop.style.left = Math.max(12, (window.innerWidth - pop.offsetWidth) / 2) + "px";
        pop.style.top = "120px";
        return;
      }
      var pageRow = ev.target.closest("[data-goq]");
      if (pageRow) {
        pendingQuery = pageRow.dataset.q;
        close();
        go(+pageRow.dataset.goq);
      }
    });

    /* ----- chrome ----- */
    document.getElementById("prevBtn").addEventListener("click", function () { go(cur - 1); });
    document.getElementById("nextBtn").addEventListener("click", function () { go(cur + 1); });
    document.getElementById("homeBtn").addEventListener("click", function () { go(0); });
    var greekBtn = document.getElementById("greekBtn");
    greekBtn.addEventListener("click", function () {
      var hidden = document.body.classList.toggle("hide-greek");
      greekBtn.setAttribute("aria-pressed", String(!hidden));
    });
    document.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape") { close(); hidePopover(); return; }
      if (ev.target.tagName === "INPUT") return;
      if (ev.key === "ArrowLeft") go(cur - 1);
      else if (ev.key === "ArrowRight") go(cur + 1);
      else if (ev.key === "/") { ev.preventDefault(); open("search"); }
    });

    render();
  };

  /* ----- load data: inline first, fetch fallback ----- */
  if (window.KOINOS_DATA) boot(window.KOINOS_DATA);
  else fetch("koinos_data.json").then(function (r) { return r.json(); }).then(boot).catch(function () { boot(null); });
})();
</script>
</body>
